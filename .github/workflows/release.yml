name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements_build.txt

      - name: Get version
        id: ver
        shell: pwsh
        run: |
          $v = python -c "from VERSION import __version__; print(__version__)"
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build executable and installer
        shell: pwsh
        run: python build.py

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "電子帳簿保存システム ${{ steps.ver.outputs.VERSION }}"
          body: |
            ## 電子帳簿保存システム ${{ steps.ver.outputs.VERSION }}

            ### インストール方法
            1. 下記の `DenshiChobohozoSystem_${{ steps.ver.outputs.VERSION }}_setup.exe` をダウンロード
            2. ダウンロードしたファイルをダブルクリックして実行
            3. 画面の指示に従ってインストール

            ### 注意事項
            - OCR機能は Windows 10/11 標準搭載エンジンを使用するため追加インストール不要です
            - 日本語 OCR には Windows の日本語言語パックが必要です（通常はインストール済み）

            ※ 管理者権限が必要です。
          files: installer/Output/DenshiChobohozoSystem_${{ steps.ver.outputs.VERSION }}_setup.exe
          draft: false
          prerelease: false
